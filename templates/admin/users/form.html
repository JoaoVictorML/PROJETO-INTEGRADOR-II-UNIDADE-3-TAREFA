{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-secondary p-4 shadow" style="background-color: #181818; border-radius: 15px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold text-white mb-0">
                        {{ 'Editar Cliente' if user else 'Novo Cliente' }}
                    </h4>
                    <a href="{{ url_for('user_bp.list_users') }}" class="btn btn-sm btn-outline-secondary text-light">
                        Voltar
                    </a>
                </div>

                {% if error %}
                <div class="alert alert-danger small py-2">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-light">Nome Completo *</label>
                        <input type="text" name="nome" class="form-control" required
                               placeholder="Ex: João Silva"
                               value="{{ user.nome if user else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">E-mail *</label>
                        <input type="email" name="login" class="form-control" required
                               placeholder="cliente@email.com"
                               value="{{ user.login if user else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">CPF ou Telefone *</label>
                        <input type="text" name="cpf" class="form-control" required
                               placeholder="000.000.000-00"
                               value="{{ user.cpf if user else '' }}">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-light">
                            {{ 'Nova Senha (deixe em branco para manter)' if user else 'Senha *' }}
                        </label>
                        <input type="password" name="password" class="form-control"
                               {{ 'required' if not user else '' }}
                               placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill py-2">
                        {{ 'Salvar Alterações' if user else 'Cadastrar Cliente' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
