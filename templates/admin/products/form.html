{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-secondary p-4 shadow" style="background-color: #181818; border-radius: 15px;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold text-white mb-0">
                        {{ 'Editar Produto' if product else 'Novo Produto' }}
                    </h4>
                    <a href="{{ url_for('product_bp.list_products') }}" class="btn btn-sm btn-outline-secondary text-light">
                        Voltar
                    </a>
                </div>

                {% if error %}
                <div class="alert alert-danger small py-2">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-light">Nome do Produto *</label>
                        <input type="text" name="name" class="form-control" required
                               placeholder="Ex: Recreio Bacon Duplo"
                               value="{{ product.name if product else '' }}">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label class="form-label text-light">Categoria *</label>
                            <select name="category" class="form-select">
                                {% set cat = product.category if product else 'Hambúrgueres' %}
                                <option value="Hambúrgueres" {{ 'selected' if cat == 'Hambúrgueres' }}>Hambúrgueres</option>
                                <option value="Combos" {{ 'selected' if cat == 'Combos' }}>Combos</option>
                                <option value="Acompanhamentos" {{ 'selected' if cat == 'Acompanhamentos' }}>Acompanhamentos</option>
                                <option value="Bebidas" {{ 'selected' if cat == 'Bebidas' }}>Bebidas</option>
                                <option value="Sobremesas" {{ 'selected' if cat == 'Sobremesas' }}>Sobremesas</option>
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label text-light">Preço (R$) *</label>
                            <input type="number" step="0.01" min="0.01" name="price" class="form-control" required
                                   placeholder="34.90"
                                   value="{{ product.price if product else '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Descrição / Ingredientes</label>
                        <textarea name="description" rows="3" class="form-control"
                                  placeholder="Ex: Pão brioche, 2 blends 160g, cheddar cremoso, bacon crocante...">{{ product.description if product else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">URL da Imagem (opcional)</label>
                        <input type="text" name="image_url" class="form-control"
                               placeholder="https://... ou /static/images/burger.jpg"
                               value="{{ product.image_url if product else '' }}">
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="activeSwitch" name="active"
                               {{ 'checked' if (not product or product.active) }}>
                        <label class="form-check-label text-light" for="activeSwitch">
                            Disponível no cardápio
                        </label>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill py-2">
                        {{ 'Salvar Alterações' if product else 'Cadastrar Produto' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
