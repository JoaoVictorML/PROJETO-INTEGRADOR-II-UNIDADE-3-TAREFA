{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh">
  <div class="col-md-5">
    <div class="card p-4 shadow-sm border bg-custom-card"
      style="border-color: var(--secondary) !important; border-radius: 15px">
      <div class="text-center mb-4">
        <h3 class="fw-bold">Crie sua conta</h3>
        <p class="text-muted small">
          Cadastre-se para fazer seus pedidos na Hamburgueria Recreio
        </p>
      </div>

      {% if error %}
      <div class="alert alert-danger small py-2 text-start" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('views_bp.signup') }}">
        <div class="mb-3 text-start">
          <label for="nome" class="form-label fw-medium">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" required placeholder="Seu nome completo" />
        </div>

        <div class="mb-3 text-start">
          <label for="email" class="form-label fw-medium">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" required placeholder="exemplo@email.com" />
        </div>

        <div class="mb-3 text-start">
          <label for="password" class="form-label fw-medium">Senha</label>
          <input type="password" class="form-control" id="password" name="password" required placeholder="Crie uma senha" />
        </div>

        <button type="submit" class="btn btn-custom-primary w-100 rounded-pill fw-bold mb-3">
          Cadastrar
        </button>

        <div class="text-center small">
          <span class="text-muted">Já tem uma conta?</span>
          <a href="{{ url_for('views_bp.signin', tipo='user') }}" class="text-warning fw-semibold text-decoration-none">
            Entrar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
